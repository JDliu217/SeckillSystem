spring:
  application:
    name: seckill-job
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seckill?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&zeroDateTimeBehavior=convertToNull
    username: root
    password: 123456
  redis:
    database: 5
    host: 127.0.0.1
    port: 6379
    password:  seckill123
    timeout: 50000
  elasticsearch:
    host: 127.0.0.1
    port: 9200
    username: elastic
    password: seckill123

server:
  port: 8016
seckill:
  orderApiProperties:
    host: http://127.0.0.1:8011
    createOrderUrl: /v1/web/trade/createForSeckill
    secretKey: seckill123
  # 订单超时关单
  # delayLevel 是 RocketMQ 固定的 18 个等级（1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h）
  # 14 = 10 分钟，与 orderTimeoutSeconds 保持同一个口径
  orderTimeoutTopic: seckill.order.timeout.topic
  orderTimeoutGroup: seckill-order-timeout-group
  orderTimeoutDelayLevel: 14
  orderTimeoutSeconds: 600

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: seckill-group
    send-message-timeout: 3000
